name: resume-forge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_NAME: ResumeAI
      DEBUG: "true"
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./backend:/app
    restart: unless-stopped
